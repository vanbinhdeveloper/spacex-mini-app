<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SpaceX Mini App</title>
  <!-- THƯ VIỆN TELEGRAM WEB APP (Bắt buộc phải có) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="pad">
    <div class="tab-nav">
      <button class="tab-button active" data-page="page-create">
        <span class="icon"><img src="icons/user.png" alt="Tạo tài khoản"></span>
        <span class="text">Tạo tài khoản</span>
      </button>
      <button class="tab-button" data-page="page-promo">
        <span class="icon"><img src="icons/xinkm.png" alt="Xin khuyến mãi"></span>
        <span class="text">Xin khuyến mãi</span>
      </button>
      <button class="tab-button" data-page="page-chucnang">
        <span class="icon"><img src="icons/logo48.png" alt="Chức năng"></span>
        <span class="text">Chức năng</span>
      </button>
    </div>

    <!-- TAB 1: TẠO TÀI KHOẢN -->
    <div id="page-create" class="page-content active">
      <div id="app-content">
        <h3>TELEGRAM @HATOKI_NICE</h3>

        <!-- Bản đồ chọn Giao diện (OKVIP, KJC, ABCVIP...) -->
        <div class="map-container">
          <svg viewBox="0 0 700 500" class="map-background">
            <rect style="fill: #f5f0e5" width="700" height="500"></rect>
            <path style="fill: #90daee" d="M0,367.82c5.83-4.39,14.42-10.16,25.59-15.34,4.52-2.09,43.19-19.51,79.55-11.93,36.1,7.52,35.75,32.55,78.41,60.23,46.34,30.06,109.47,41.21,123.32,22.1,11.95-16.49-22.61-41.92-13.66-84.6,4.85-23.1,22.33-50.71,47.73-58.52,42.42-13.05,78.83,39.45,102.84,23.86,15.81-10.26.01-32.87,22.73-74.43,5.8-10.62,11.65-21.15,11.93-36.93.28-15.69-5.63-26.64-7.95-32.39-6.66-16.45-6.21-45.15,28.84-98.55 L 700 0 L 700 500 L 0 500 Z"></path>
          </svg>
          <div class="map-cities">
            <!-- OKVIP -->
            <div class="map-city active" data-filter="type1" style="--x: 20; --y: 20;">
              <div class="map-city__label">
                <span class="map-city__sign" style="--city-sign-color-back: #ffffff;">
                  <img src="icons/logo-okvip1.png" alt="OKVIP" class="map-logo">
                </span>
              </div>
            </div>
            <!-- KJC -->
            <div class="map-city" data-filter="type2" style="--x: 40; --y: 40;">
              <div class="map-city__label">
                <span class="map-city__sign" style="--city-sign-color-back: #ffffff;">
                  <img src="icons/logo-kjc.png" alt="KJC" class="map-logo">
                </span>
              </div>
            </div>
            <!-- ABCVIP -->
            <div class="map-city" data-filter="type3" style="--x: 50; --y: 18;">
              <div class="map-city__label">
                <span class="map-city__sign" style="--city-sign-color-back: #ffffff;">
                  <img src="icons/abcvip.png" alt="ABCVIP" class="map-logo">
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Danh sách trang web (Tự động chuyển khi bấm Map) -->
        <div id="interface-group-1" class="site-group" style="display: block;">
          <h4 class="sub-heading">NHÀ CÁI OKVIP</h4>
          <div class="sites">
            <label data-site="shbet"><input type="radio" name="site_selection" value="shbet" checked> SHBET</label>
            <label data-site="f8bet"><input type="radio" name="site_selection" value="f8bet"> F8BET</label>
            <label data-site="new88"><input type="radio" name="site_selection" value="new88"> NEW88</label>
            <label data-site="hi88"><input type="radio" name="site_selection" value="hi88"> HI88</label>
          </div>
        </div>
        <div id="interface-group-2" class="site-group" style="display: none;">
          <h4 class="sub-heading2">NHÀ CÁI KJC</h4>
          <div class="sites">
            <label data-site="qq88"><input type="radio" name="site_selection" value="qq88"> QQ88</label>
            <label data-site="rr88"><input type="radio" name="site_selection" value="rr88"> RR88</label>
          </div>
        </div>
        <div id="interface-group-3" class="site-group" style="display: none;">
          <h4 class="sub-heading3">NHÀ CÁI ABCVIP</h4>
          <div class="sites">
            <label data-site="j88"><input type="radio" name="site_selection" value="j88"> J88</label>
            <label data-site="u888"><input type="radio" name="site_selection" value="u888"> U888</label>
          </div>
        </div>

        <!-- Form nhập liệu -->
        <h3>THÔNG TIN ĐĂNG KÝ</h3>
        <div class="form-grid">
          <div class="inputGroup"><input id="f_username" type="text" required placeholder=" "><label>Tên đăng nhập</label></div>
          <div class="inputGroup"><input id="f_password" type="password" required placeholder=" "><label>Mật khẩu</label></div>
          <div class="inputGroup"><input id="f_fullname" type="text" required placeholder=" "><label>Họ và tên</label></div>
          <div class="inputGroup"><input id="f_phone" type="text" required placeholder=" "><label>Số điện thoại</label></div>
        </div>

        <h3>THÔNG TIN NGÂN HÀNG</h3>
        <div class="form-grid">
          <div class="inputGroup"><input id="f_bankName" list="bankList" required placeholder=" "><label>Chọn ngân hàng</label></div>
          <div class="inputGroup"><input id="f_accountNumber" type="text" required placeholder=" "><label>Số tài khoản</label></div>
          <div class="inputGroup"><input id="f_branch" type="text" required placeholder=" "><label>Chi nhánh</label></div>
          <div class="inputGroup"><input id="f_withdrawPass" type="password" required placeholder=" "><label>Mật khẩu rút tiền</label></div>
        </div>

        <button id="startBtn" class="btn" style="margin-top: 15px;">🚀 Bắt đầu Tạo TK & Thêm Bank</button>
      </div>
    </div>
  </div>

  <!-- Danh sách Ngân hàng -->
  <datalist id="bankList">
    <option value="MBBANK">
    <option value="TECHCOMBANK">
    <option value="VIETCOMBANK">
    <option value="ACB BANK">
    <option value="BIDV BANK">
  </datalist>

  <!-- LOGIC JAVASCRIPT GỬI DATA CHO TELEGRAM -->
  <script>
    // 1. Khởi tạo Telegram Web App
    let tg = window.Telegram.WebApp;
    tg.expand(); 

    // 2. Chuyển Tab Giao diện
    const tabs = document.querySelectorAll('.tab-button');
    const contents = document.querySelectorAll('.page-content');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.getAttribute('data-page')).classList.add('active');
        });
    });

    // 3. Chuyển Map (OKVIP / KJC / ABCVIP)
    const mapCities = document.querySelectorAll('.map-city');
    const siteGroups = document.querySelectorAll('.site-group');
    mapCities.forEach((city, index) => {
        city.addEventListener('click', () => {
            mapCities.forEach(c => c.classList.remove('active'));
            siteGroups.forEach(g => g.style.display = 'none');
            city.classList.add('active');
            document.getElementById('interface-group-' + (index + 1)).style.display = 'block';
        });
    });

    // 4. GỬI DỮ LIỆU VỀ PYTHON BOT
    document.getElementById('startBtn').addEventListener('click', function() {
        let selectedSite = document.querySelector('input[name="site_selection"]:checked');
        
        let payload = {
            task_name: "REGISTER_AND_BANK",
            site_key: selectedSite ? selectedSite.value : 'shbet',
            username: document.getElementById('f_username').value,
            password: document.getElementById('f_password').value,
            fullname: document.getElementById('f_fullname').value,
            phone: document.getElementById('f_phone').value,
            bankName: document.getElementById('f_bankName').value,
            accountNumber: document.getElementById('f_accountNumber').value,
            branch: document.getElementById('f_branch').value,
            withdrawPass: document.getElementById('f_withdrawPass').value
        };

        // Hàm có sẵn của Telegram, truyền cục JSON đi
        tg.sendData(JSON.stringify(payload)); 
        
        // Gửi xong thì đóng Mini App lại
        tg.close(); 
    });
  </script>
</body>
</html>
